# ai.iportal.uz — Nginx Konfiguratsiyasi (SSE Streaming va WebSocket qo'llab-quvvatlaydi)
# /etc/nginx/sites-available/ai.iportal.uz

server {
    listen 80;
    server_name ai.iportal.uz;

    # HTTP dan HTTPS ga avtomatik yo'naltirish
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ai.iportal.uz;

    # SSL sertifikatlari (Certbot Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/ai.iportal.uz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ai.iportal.uz/privkey.pem;

    # Katta payloadlarni qabul qilish
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket va SSE Streaming sozlamalari (Juda muhim!)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (Server-Sent Events) buferlashni o'chirish (Instant streaming uchun)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
